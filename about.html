<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Wahid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>About Me</h1>
  <p>I specialize in building secure, bilingual dashboards with payment integration and Jalali calendar support.</p>
  
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html" class="active">About</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
  </nav>

  <button id="toggleTheme">Toggle Light/Dark Mode</button>

  <div class="video-container">
    <video id="aboutmeVideo" controls poster="thumbnail.png">
      <source src="aboutme.mp4" type="video/mp4">
    </video>
  </div>
  
  <div class="caption">Let’s build your dashboard</div>

  <footer>
    <!-- همان فوتر با آیکون‌ها -->
  </footer>

  <script>
    const toggleBtn = document.getElementById('toggleTheme');
  
    // اعمال حالت ذخیره‌شده هنگام بارگذاری
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
    });
  
    // تغییر حالت و ذخیره در localStorage
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      if (document.body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
  
</body>
</html>
